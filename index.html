<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="קניות" />
    <meta name="description" content="רשימת קניות משותפת" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@700;800&family=Secular+One&display=swap"
      rel="stylesheet"
    />
    <title>רשימת קניות</title>
    <script>
      // Applied before first paint so a launch never flashes the wrong look.
      try {
        var t = localStorage.getItem('theme')
        var dark =
          t === 'dark' ||
          ((t === null || t === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        var skin = localStorage.getItem('skin')
        if (['market', 'night', 'colorful'].indexOf(skin) !== -1) {
          document.documentElement.dataset.skin = skin
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
